[project]
name = "g1-action-recorder"
version = "0.2.0"
description = "Record, compose, and play Unitree G1 upper-body poses and actions."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "jinja2>=3.1,<4",
    "loguru>=0.7.3",
    "mujoco>=3.3,<4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<6",
    "pin-pink>=4.4,<5",
    "python-dotenv>=1,<2",
    "python-lzf>=0.2.6",
    "pyyaml>=6,<7",
    "quadprog>=0.1,<1",
    "requests>=2.32,<3",
    "scipy>=1.13,<2",
    "uvicorn>=0.52,<1",
    "viser[urdf]>=1.0,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ruff>=0.11",
]

[tool.uv]
package = false
# PyPI pinocchio (`pin`) has no Windows wheels; on Windows it comes from conda-forge instead (see README).
override-dependencies = ["pin>=3.4; sys_platform != 'win32'"]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
# Every module puts the project root on sys.path before its own imports, so it runs from an IDE right-click.
ignore = ["E402"]
