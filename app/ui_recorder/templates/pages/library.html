{% import "ui.html" as ui %}
<section data-page="library" data-wide="true" data-title="Library" data-hint="Delete moves files to data/.trash. A pose an action uses can't be deleted until that action is gone." class="hidden min-h-0 flex-1 flex-col gap-y-4">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div id="library-tabs" class="flex flex-wrap rounded-lg bg-gray-100 p-0.5" role="tablist" aria-label="What to list">
      {% for id, label in [("actions", "Actions"), ("base", "Base"), ("left_arm", "Left arm"), ("right_arm", "Right arm"), ("composed", "Composed")] %}
      <button type="button" role="tab" data-library-tab="{{ id }}" class="group flex items-center gap-x-1.5 rounded-md px-3 py-1.5 text-[13px] font-medium text-gray-500 data-[active=true]:bg-white data-[active=true]:font-semibold data-[active=true]:text-gray-900 data-[active=true]:shadow-xs">
        {{ label }}<span data-count class="rounded-full bg-gray-200 px-1.5 text-[11px] text-gray-600 group-data-[active=true]:bg-blue-50 group-data-[active=true]:text-blue-700"></span>
      </button>
      {% endfor %}
    </div>
    <div class="flex gap-x-2">
      <label for="library-pose-file" class="{{ ui.button }} cursor-pointer">{{ ui.icon("upload") }}Import pose
        <input id="library-pose-file" type="file" accept=".json" class="sr-only" />
      </label>
      <label for="library-action-file" class="{{ ui.button }} cursor-pointer">{{ ui.icon("upload") }}Import action
        <input id="library-action-file" type="file" accept=".zip" class="sr-only" />
      </label>
    </div>
  </div>
  <div class="min-h-0 overflow-y-auto {{ ui.card }}">
    <table class="w-full text-[13px]">
      <thead id="library-head" class="sticky top-0 bg-gray-50 text-[11px] uppercase tracking-wide text-gray-500"></thead>
      <tbody id="library-rows" class="divide-y divide-gray-200 border-t border-gray-200"></tbody>
    </table>
    <p id="library-note" class="border-t border-gray-200 px-4 py-2.5 text-xs text-gray-500"></p>
  </div>
</section>
